[package]
name = "clean-runner"
version = "0.2.0"
edition = "2021"
description = "Standalone WebAssembly runner for Clean Language programs"
license = "MIT"

[[bin]]
name = "clean-runner"
path = "src/main.rs"

[dependencies]
wasmtime = "26.0"
tokio = { version = "1.35", features = ["rt-multi-thread"] }
host-bridge = { path = "../clean-server/host-bridge" }
