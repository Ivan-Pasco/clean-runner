[package]
name = "clean-runner"
version = "0.2.2"
edition = "2021"
description = "Standalone WebAssembly runner for Clean Language programs"
license = "MIT"

[[bin]]
name = "clean-runner"
path = "src/main.rs"

[dependencies]
wasmtime = "26.0"
tokio = { version = "1.35", features = ["rt-multi-thread"] }
host-bridge = { git = "https://github.com/Ivan-Pasco/clean-server-old.git", rev = "bfc4d34510fadd4a59f4bb69de7d6feee74d71a1" }
